name: Semantic PR
on:
  pull_request:
    types: [edited, opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            # default https://github.com/commitizen/conventional-commit-types/blob/master/index.json
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

            # custom
            deprecate
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test breaking-change validation
        run: node --test .github/scripts/validateBreakingChangePullRequest.test.cjs
      - name: Validate breaking-change markers
        uses: actions/github-script@v9
        with:
          script: |
            const action = require('${{ github.workspace }}/.github/scripts/validateBreakingChangePullRequest.cjs')
            await action({context, core})
