name: Schedule Updates
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1,4"
jobs:
  browserslist-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Run update-browserslist-db
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          pnpm dlx update-browserslist-db@latest
      - name: Commit and create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: ci/update-browserslist-db
          delete-branch: true
          commit-message: "build: update browserslist db"
          title: "build: update browserslist db"
          body: "This PR was automatically generated by the update-browserslist-db GitHub action"
          token: ${{ secrets.ADMIN_TOKEN }}
          labels: "chore,skip visual snapshots"

  update-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Update 3rd party licenses
        run: |
          pnpm install
          pnpm util:update-3rd-party-licenses
      - name: Commit and create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            **/THIRD-PARTY-NOTICES.md
          base: dev
          branch: ci/update-3rd-party-notices
          delete-branch: true
          commit-message: "docs: update 3rd party notices"
          title: "docs: update 3rd party notices"
          body: "This PR was automatically generated by the update-licenses GitHub action"
          token: ${{ secrets.ADMIN_TOKEN }}
          labels: "docs,skip visual snapshots"
