name: Deploy Latest
on:
  workflow_dispatch:
    inputs:
      prepare_release_pr:
        description: "Prepare release PR with release-please"
        required: false
        default: true
        type: boolean
      publish_to_npm:
        description: "Publish to NPM"
        required: false
        default: true
        type: boolean
      upload_assets:
        description: "Upload assets to GH releases"
        required: false
        default: true
        type: boolean
      packages:
        description: "List of packages to upload release assets for (comma-separated, or JSON array string)"
        required: false
        default: "[]"
        type: string
      submit_cherry_pick_pr:
        description: "Submit cherry-pick-release-commit PR"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - "releases/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.prepare_release_pr }}
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
          target-branch: ${{ github.ref_name }}

      - name: Checkout Repository
        if: ${{ (github.event_name != 'workflow_dispatch' && steps.release.outputs.releases_created == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.publish_to_npm || inputs.upload_assets || inputs.submit_cherry_pick_pr)) }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Setup Node
        if: ${{ (github.event_name != 'workflow_dispatch' && steps.release.outputs.releases_created == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.publish_to_npm || inputs.upload_assets || inputs.submit_cherry_pick_pr)) }}
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: "https://registry.npmjs.org"

      - name: Build, Publish, Upload Assets, Cherry Pick PR
        if: ${{ (github.event_name != 'workflow_dispatch' && steps.release.outputs.releases_created == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.publish_to_npm || inputs.upload_assets || inputs.submit_cherry_pick_pr)) }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}

          PREPARE_RELEASE_PR: ${{ github.event_name != 'workflow_dispatch' || inputs.prepare_release_pr }}
          PUBLISH_TO_NPM: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_npm }}
          UPLOAD_ASSETS: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_assets }}
          SUBMIT_CHERRY_PICK_PR: ${{ github.event_name != 'workflow_dispatch' || inputs.submit_cherry_pick_pr }}

          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          PACKAGES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.packages || '[]' }}
        run: |
          set -euo pipefail

          if [[ "$PREPARE_RELEASE_PR" == "true" && "$RELEASES_CREATED" != "true" ]]; then
            echo "No releases created by release-please. Skipping."
            exit 0
          fi

          npm install

          if [[ "$PUBLISH_TO_NPM" == "true" ]]; then
            npm run build

            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"

            releaseCommitSha="$(git rev-parse HEAD)"

            git add package-lock.json || true
            git commit -m "build(deps): update package-lock" || true

            npm run publish:latest
          else
            releaseCommitSha="$(git rev-parse HEAD)"
          fi

          if [[ "$UPLOAD_ASSETS" == "true" ]]; then
            releasePathsJson="$(node -e 'const raw=process.argv[2] ?? "[]"; const fallback=process.argv[3] ?? "[]"; const asArray=(v)=>{try{const p=JSON.parse(v); return Array.isArray(p)?p:null}catch{return null}}; const a=asArray(raw); if(a) return console.log(JSON.stringify(a)); const b=asArray(fallback); if(b) return console.log(JSON.stringify(b)); const list=(fallback||"").split(",").map(s=>s.trim()).filter(Boolean); console.log(JSON.stringify(list));' "$PATHS_RELEASED" "$PACKAGES_INPUT")"

            if [[ "$releasePathsJson" != "[]" ]]; then
              npm run util:upload-release-assets -- "$releasePathsJson"
            else
              echo "No packages provided for asset upload. Skipping."
            fi
          fi

          if [[ "$SUBMIT_CHERRY_PICK_PR" == "true" ]]; then
            git checkout -b ci/cherry-pick-release-commit origin/dev

            if ! git cherry-pick "$releaseCommitSha"; then
              git checkout --theirs "${GITHUB_WORKSPACE}/packages/*/CHANGELOG.md"
              git checkout --theirs "${GITHUB_WORKSPACE}/packages/*/package.json"
              git cherry-pick --continue
            fi

            git push -u origin HEAD
            gh pr create --fill --head "ci/cherry-pick-release-commit" --base "dev" --label "skip visual snapshots"
          fi
