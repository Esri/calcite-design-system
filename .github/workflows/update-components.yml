name: Update Issue Template Components
on:
  push:
    paths:
      - "packages/src/components/**"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "18"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || true
      - name: Run updater
        run: |
          node .github/scripts/updateIssueTemplateComponents.js
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          commit-message: "chore: update issue template component lists"
          branch: update/issue-template-components
          title: "chore: update issue template component lists"
          body: Automated update of component lists in the enhancement, bug, accessibility, and documentation issue templates.
          labels: chore, skip visual snapshots
          reviewers: calcite-admin
