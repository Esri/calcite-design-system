<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Demos</title>
    <script src="/src/demos/_assets/head.ts"></script>
    <style>
      .parent-flex {
        display: flex;
        padding: 25px 0;
        flex-wrap: wrap;
      }

      .font,
      .header {
        color: var(--calcite-color-text-3);
        font-weight: var(--calcite-font-weight-medium);
      }

      .font {
        font-size: var(--calcite-font-size-0);
      }

      .header {
        font-size: var(--calcite-font-size-2);
      }

      .child-flex {
        flex: 0 0 22%;
        margin: 0 25px;
      }

      .right-aligned-text {
        text-align: right;
        flex: 0 0 12%;
      }
    </style>
  </head>

  <body>
    <demo-dom-swapper>
      <!-- These changes will be removed before merging this branch -->

      <!-- Sizes -->
      <div class="parent-flex">
        <div class="child-flex font right-aligned-text"></div>
        <div class="child-flex font">Small</div>
        <div class="child-flex font">Medium</div>
        <div class="child-flex font">Large</div>
      </div>

      <div class="parent-flex">
        <div class="child-flex font right-aligned-text">Enable theming</div>
        <div class="child-flex">
          <calcite-segmented-control id="theming-toggle">
            <calcite-segmented-control-item value="Unthemed" checked>Unthemed</calcite-segmented-control-item>
            <calcite-segmented-control-item value="Themed">Themed</calcite-segmented-control-item>
          </calcite-segmented-control>
        </div>
      </div>

      <!-- Input number -->
      <div class="parent-flex">
        <div class="child-flex font right-aligned-text">Input number</div>
        <div class="child-flex">
          <calcite-input-number
            placeholder="Placeholder"
            scale="s"
            value="123"
            clearable
            number-button-type="horizontal"
          />
        </div>

        <div class="child-flex">
          <calcite-input-number
            placeholder="Placeholder"
            scale="m"
            value="123"
            step="1"
            clearable
            number-button-type="horizontal"
          />
        </div>

        <div class="child-flex">
          <calcite-input-number
            placeholder="Placeholder"
            scale="l"
            value="123"
            step="1"
            clearable
            number-button-type="horizontal"
          />
        </div>
      </div>

      <!-- Input text -->
      <div class="parent-flex">
        <div class="child-flex font right-aligned-text">Input text</div>
        <div class="child-flex">
          <calcite-input-text placeholder="Placeholder" value="abc" scale="s" clearable clearable />
        </div>

        <div class="child-flex">
          <calcite-input-text placeholder="Placeholder" value="abc" scale="m" clearable clearable />
        </div>

        <div class="child-flex">
          <calcite-input-text placeholder="Placeholder" value="abc" scale="l" clearable clearable />
        </div>
      </div>

      <!-- Input -->
      <div class="parent-flex">
        <div class="child-flex font right-aligned-text">Input</div>
        <div class="child-flex">
          <calcite-input placeholder="Placeholder" scale="s" label-text="label text" clearable type="text" value="abc">
          </calcite-input>
        </div>

        <div class="child-flex">
          <calcite-input type="text" placeholder="Placeholder" scale="m" label-text="label text" clearable value="abc">
          </calcite-input>
        </div>

        <div class="child-flex">
          <calcite-input type="text" placeholder="Placeholder" scale="l" label-text="label text" clearable value="abc">
          </calcite-input>
        </div>
      </div>

      <!-- Combobox -->
      <div class="parent-flex">
        <div class="child-flex font right-aligned-text">Combobox</div>
        <div class="child-flex">
          <calcite-combobox
            label="test"
            label-text="Label text"
            placeholder="select element"
            max-items="6"
            selection-mode="single"
            scale="s"
            required
            clearable
          >
            <calcite-combobox-item value="Trees" text-label="Trees">
              <calcite-combobox-item value="Pine" text-label="Pine">
                <calcite-combobox-item value="Pine Nested" text-label="Pine Nested"></calcite-combobox-item>
              </calcite-combobox-item>
              <calcite-combobox-item value="Sequoia" disabled text-label="Sequoia"></calcite-combobox-item>
              <calcite-combobox-item value="Douglas Fir" text-label="Douglas Fir"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Flowers" text-label="Flowers">
              <calcite-combobox-item value="Daffodil" text-label="Daffodil"></calcite-combobox-item>
              <calcite-combobox-item value="Black Eyed Susan" text-label="Black Eyed Susan"></calcite-combobox-item>
              <calcite-combobox-item value="Nasturtium" text-label="Nasturtium"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Animals" text-label="Animals">
              <calcite-combobox-item value="Birds" text-label="Birds"></calcite-combobox-item>
              <calcite-combobox-item value="Reptiles" text-label="Reptiles"></calcite-combobox-item>
              <calcite-combobox-item value="Amphibians" text-label="Amphibians"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Rocks" text-label="Rocks"></calcite-combobox-item>
            <calcite-combobox-item value="Insects" text-label="Insects"></calcite-combobox-item>
            <calcite-combobox-item value="Rivers" text-label="Rivers"></calcite-combobox-item>
          </calcite-combobox>
        </div>

        <div class="child-flex">
          <calcite-combobox
            label="test"
            label-text="Label text"
            placeholder="select element"
            max-items="6"
            selection-mode="single"
            scale="m"
            required
            clearable
          >
            <calcite-combobox-item value="Trees" text-label="Trees">
              <calcite-combobox-item value="Pine" text-label="Pine">
                <calcite-combobox-item value="Pine Nested" text-label="Pine Nested"></calcite-combobox-item>
              </calcite-combobox-item>
              <calcite-combobox-item value="Sequoia" disabled text-label="Sequoia"></calcite-combobox-item>
              <calcite-combobox-item value="Douglas Fir" text-label="Douglas Fir"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Flowers" text-label="Flowers">
              <calcite-combobox-item value="Daffodil" text-label="Daffodil"></calcite-combobox-item>
              <calcite-combobox-item value="Black Eyed Susan" text-label="Black Eyed Susan"></calcite-combobox-item>
              <calcite-combobox-item value="Nasturtium" text-label="Nasturtium"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Animals" text-label="Animals">
              <calcite-combobox-item value="Birds" text-label="Birds"></calcite-combobox-item>
              <calcite-combobox-item value="Reptiles" text-label="Reptiles"></calcite-combobox-item>
              <calcite-combobox-item value="Amphibians" text-label="Amphibians"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Rocks" text-label="Rocks"></calcite-combobox-item>
            <calcite-combobox-item value="Insects" text-label="Insects"></calcite-combobox-item>
            <calcite-combobox-item value="Rivers" text-label="Rivers"></calcite-combobox-item>
          </calcite-combobox>
        </div>

        <div class="child-flex">
          <calcite-combobox
            label="test"
            label-text="Label text"
            placeholder="select element"
            max-items="6"
            selection-mode="single"
            scale="l"
            required
            clearable
          >
            <calcite-combobox-item value="Trees" text-label="Trees">
              <calcite-combobox-item value="Pine" text-label="Pine">
                <calcite-combobox-item value="Pine Nested" text-label="Pine Nested"></calcite-combobox-item>
              </calcite-combobox-item>
              <calcite-combobox-item value="Sequoia" disabled text-label="Sequoia"></calcite-combobox-item>
              <calcite-combobox-item value="Douglas Fir" text-label="Douglas Fir"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Flowers" text-label="Flowers">
              <calcite-combobox-item value="Daffodil" text-label="Daffodil"></calcite-combobox-item>
              <calcite-combobox-item value="Black Eyed Susan" text-label="Black Eyed Susan"></calcite-combobox-item>
              <calcite-combobox-item value="Nasturtium" text-label="Nasturtium"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Animals" text-label="Animals">
              <calcite-combobox-item value="Birds" text-label="Birds"></calcite-combobox-item>
              <calcite-combobox-item value="Reptiles" text-label="Reptiles"></calcite-combobox-item>
              <calcite-combobox-item value="Amphibians" text-label="Amphibians"></calcite-combobox-item>
            </calcite-combobox-item>
            <calcite-combobox-item value="Rocks" text-label="Rocks"></calcite-combobox-item>
            <calcite-combobox-item value="Insects" text-label="Insects"></calcite-combobox-item>
            <calcite-combobox-item value="Rivers" text-label="Rivers"></calcite-combobox-item>
          </calcite-combobox>
        </div>
      </div>

      <!-- Auto complete -->
      <div class="parent-flex">
        <div class="child-flex font right-aligned-text">Auto complete</div>
        <div class="child-flex">
          <calcite-autocomplete
            scale="s"
            class="locator-autocomplete"
            name="location"
            required
            placeholder="Placeholder"
            value="abc"
          >
          </calcite-autocomplete>
        </div>

        <div class="child-flex">
          <calcite-autocomplete
            scale="m"
            class="locator-autocomplete"
            name="location"
            required
            placeholder="Placeholder"
            value="abc"
          >
          </calcite-autocomplete>
        </div>

        <div class="child-flex">
          <calcite-autocomplete
            scale="l"
            class="locator-autocomplete"
            name="location"
            required
            placeholder="Placeholder"
            value="abc"
          >
          </calcite-autocomplete>
        </div>
      </div>

      <!-- Filter -->
      <div class="parent-flex">
        <div class="child-flex font right-aligned-text">Filter</div>
        <div class="child-flex">
          <calcite-filter scale="s" placeholder="Placeholder"> </calcite-filter>
        </div>

        <div class="child-flex">
          <calcite-filter scale="m" placeholder="Placeholder"> </calcite-filter>
        </div>

        <div class="child-flex">
          <calcite-filter scale="l" placeholder="Placeholder"> </calcite-filter>
        </div>
      </div>

      <!-- Input time zone -->
      <div class="parent-flex">
        <div class="child-flex font right-aligned-text">Input time zone</div>
        <div class="child-flex">
          <calcite-input-time-zone scale="s" clearable></calcite-input-time-zone>
        </div>

        <div class="child-flex">
          <calcite-input-time-zone scale="m" clearable></calcite-input-time-zone>
        </div>

        <div class="child-flex">
          <calcite-input-time-zone scale="l" clearable></calcite-input-time-zone>
        </div>
      </div>
    </demo-dom-swapper>
    <demo-options></demo-options>
  </body>
</html>
