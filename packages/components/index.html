<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Demos</title>
    <script src="/src/demos/_assets/head.ts"></script>
  </head>

  <body>
    <calcite-shell>
      <calcite-shell-panel slot="panel-start">
        <calcite-panel heading="Drag List Items between Lists example">
          <calcite-block expanded heading="Places to visit" description="Where we'd like to go" icon-start="map">
            <calcite-list drag-enabled group="places-group" label="Places to visit">
              <calcite-list-item label="Narnia" description="Land full of forests and valleys" value="narnia">
              </calcite-list-item>
              <calcite-list-item
                label="Kings Landing"
                description="Capitol of the Seven Kingdoms"
                value="kings-landing"
              >
              </calcite-list-item>
              <calcite-list-item label="Neverland" description="Where you never have to grow up" value="neverland">
              </calcite-list-item>
            </calcite-list>
          </calcite-block>
          <calcite-block expanded heading="Visited places" description="Where we've been" icon-start="tour">
            <calcite-list drag-enabled group="places-group" label="Visited places">
              <calcite-list-item label="Gotham City" description="Home to Wayne Industries" value="gotham-city">
              </calcite-list-item>
              <calcite-list-item label="The Shire" description="Adventure at your fingertips" value="the-shire">
              </calcite-list-item>
              <calcite-list-item
                label="Hogsmeade"
                description="Grab a butterbeer at the Three Broomsticks"
                value="hogsmeade"
              >
              </calcite-list-item>
            </calcite-list>
          </calcite-block>
        </calcite-panel>
      </calcite-shell-panel>
      <calcite-panel heading="Content"></calcite-panel>
    </calcite-shell>
  </body>
</html>
