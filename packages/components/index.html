<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Demos</title>
    <script src="/src/demos/_assets/head.ts"></script>
  </head>

  <style>
    .content-spacing {
      margin: var(--calcite-space-md);
    }

    .block-content-flush {
      --calcite-block-content-space: 0px;
    }

    .button-spacing {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--calcite-space-md);
      margin-block-start: var(--calcite-space-md);
      margin-inline-start: var(--calcite-space-md);
    }

    .input-spacing {
      display: flex;
      flex-direction: column;
      gap: var(--calcite-space-lg);
      margin-top: var(--calcite-space-lg);
    }

    .loader-alignment {
      align-items: flex-start;
      margin-inline: var(--calcite-space-md);
    }

    #control-panel {
      --calcite-dialog-size-x: 400px;
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: var(--calcite-space-lg);
    }

    .control-section {
      display: flex;
      flex-direction: column;
      gap: var(--calcite-space-md);
    }

    .control-section + .control-section {
      border-block-start: var(--calcite-border-width-sm) solid var(--calcite-color-border-3);
      padding-block-start: var(--calcite-space-lg);
    }

    .control-section-heading {
      margin: 0;
      color: var(--calcite-color-text-2);
      font-size: var(--calcite-font-size-relative-base);
      font-weight: var(--calcite-font-weight-semibold);
    }

    .height-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: var(--calcite-z-index-tooltip);
    }

    .height-overlay-box {
      position: fixed;
      box-sizing: border-box;
      outline: var(--calcite-border-width-md) dashed var(--calcite-color-status-danger);
      outline-offset: calc(var(--calcite-border-width-md) * -1);
    }

    .height-overlay-label {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-start: 100%;
      margin-inline-start: var(--calcite-space-xs);
      transform: translateY(-50%);
      background-color: var(--calcite-color-status-danger);
    }

    .height-overlay-label,
    .text-inspector-label {
      padding: var(--calcite-space-px) var(--calcite-space-xs);
      border-radius: var(--calcite-corner-radius-sm);
      color: var(--calcite-color-text-inverse);
      font-size: var(--calcite-font-size-relative-sm);
      font-weight: var(--calcite-font-weight-semibold);
      line-height: var(--calcite-font-line-height-sm);
      white-space: nowrap;
    }

    .text-inspector-box {
      position: fixed;
      box-sizing: border-box;
      outline: var(--calcite-border-width-sm) solid var(--calcite-color-brand);
    }

    .text-inspector-label {
      position: fixed;
      background-color: var(--calcite-color-brand);
    }
  </style>

  <body>
    <demo-dom-swapper>
      <calcite-shell data-calcite-density="100%" data-calcite-font-scale="default">
        <calcite-shell-panel slot="panel-start" id="shell-panel-start" width="m" resizable>
          <calcite-action-bar slot="action-bar" expanded>
            <calcite-action-group>
              <calcite-action text="Add" icon="plus" text-enabled></calcite-action>
              <calcite-action active text="Layers" indicator icon="layers" text-enabled></calcite-action>
            </calcite-action-group>
            <calcite-action-group>
              <calcite-action text="Undo" icon="undo" text-enabled></calcite-action>
              <calcite-action text="Redo" indicator icon="redo" text-enabled></calcite-action>
              <calcite-action text="Save" disabled icon="save" text-enabled></calcite-action>
            </calcite-action-group>
            <calcite-action-group slot="bottom-actions">
              <calcite-action text="Tips" icon="question" text-enabled></calcite-action>
              <calcite-action text="Settings" indicator icon="gear" text-enabled></calcite-action>
            </calcite-action-group>
          </calcite-action-bar>
          <calcite-panel heading="Layers" id="panel-start" closable>
            <calcite-fab slot="fab" kind="inverse"></calcite-fab>
            <calcite-block-group drag-enabled>
              <calcite-block
                collapsible
                expanded
                heading="Symbology"
                description="Select type, color, and transparency"
                icon-start="map-pin"
              >
                <calcite-notice open>
                  <div slot="message">The viewers are going to love this</div>
                </calcite-notice>
                <div class="input-spacing">
                  <calcite-input
                    label-text="Region"
                    placeholder="Enter your region"
                    value="Southwest"
                    clearable
                  ></calcite-input>
                  <calcite-slider label-text="Transparency" value="30"></calcite-slider>
                  <calcite-input-number
                    label-text="Offset distance"
                    placeholder="Enter an offset distance"
                    step="1"
                    value="5"
                    suffix-text="mi"
                    clearable
                  >
                  </calcite-input-number>
                  <calcite-input-date-picker label-text="Select a date" placeholder=""></calcite-input-date-picker>
                </div>
              </calcite-block>
              <calcite-block
                collapsible
                expanded
                heading="Additional Options"
                description="More settings"
                icon-start="gear"
                toggle-display="switch"
                class="block-content-flush"
              >
                <calcite-list label="Park features" display-mode="nested">
                  <calcite-list-item label="Destinations" value="destinations" expanded>
                    <calcite-list-item
                      label="Hiking trails"
                      description="Designated routes for hikers to use."
                      value="hiking-trails"
                      closable
                      expanded
                    >
                      <calcite-action slot="actions-end" icon="layer" text="Trails layer"></calcite-action>
                      <calcite-list-item label="Mountain trails" value="mountain-trails" closable> </calcite-list-item>
                      <calcite-list-item label="River trails" value="river-trails" closable> </calcite-list-item>
                    </calcite-list-item>
                    <calcite-list-item
                      label="Waterfalls"
                      description="Vertical drops from a river."
                      closable
                      value="waterfalls"
                    >
                      <calcite-action slot="actions-end" icon="layer" text="Waterfalls layer"></calcite-action>
                    </calcite-list-item>
                    <calcite-list-item
                      label="Rivers"
                      description="Large naturally flowing watercourses."
                      closable
                      value="rivers"
                    >
                      <calcite-action slot="actions-end" icon="layer" text="Rivers layer"></calcite-action>
                    </calcite-list-item>
                  </calcite-list-item>
                </calcite-list>
              </calcite-block>
            </calcite-block-group>
            <calcite-button slot="footer-start" icon-start="plus" kind="neutral"></calcite-button>
            <calcite-button slot="footer-end">Button</calcite-button>
          </calcite-panel>
        </calcite-shell-panel>
        <calcite-panel heading="Content">
          <calcite-chip-group class="content-spacing" label="demo-group-label" selection-mode="multiple">
            <calcite-chip icon="file-csv" closable value="csv" label="CSV" appearance="outline-fill" kind="inverse">
              CSV
            </calcite-chip>
            <calcite-chip
              icon="file-excel"
              closable
              value="excel"
              label="Excel"
              appearance="outline-fill"
              kind="inverse"
            >
              Excel
            </calcite-chip>
            <calcite-chip
              selected
              icon="file-kml"
              closable
              value="kml"
              label="KML"
              appearance="outline-fill"
              kind="inverse"
            >
              KML
            </calcite-chip>
            <calcite-chip icon="file-text" closable value="text" label="Text" appearance="outline-fill" kind="inverse">
              Text
            </calcite-chip>
            <calcite-chip icon="file-pdf" closable value="pdf" label="PDF" appearance="outline-fill" kind="inverse">
              PDF
            </calcite-chip>
          </calcite-chip-group>
          <calcite-radio-button-group class="content-spacing" name="plantType" layout="vertical">
            <calcite-radio-button value="trees" label-text="Trees" checked></calcite-radio-button>
            <calcite-radio-button value="shrubs" label-text="Shrubs"></calcite-radio-button>
            <calcite-radio-button value="flowers" label-text="Flowers"></calcite-radio-button>
            <calcite-radio-button value="groundcover" label-text="Groundcover"></calcite-radio-button>
            <calcite-radio-button value="bushes" label-text="Bushes"></calcite-radio-button>
          </calcite-radio-button-group>
          <calcite-checkbox
            class="content-spacing"
            label-text="I agree to the terms and conditions."
          ></calcite-checkbox>
          <calcite-checkbox
            class="content-spacing"
            checked
            label-text="I agree to the terms and conditions."
          ></calcite-checkbox>
          <calcite-loader
            class="loader-alignment"
            active
            type="determinate-value"
            value="33"
            text="loader text"
          ></calcite-loader>
          <div class="button-spacing">
            <calcite-button loading width="auto">Loading</calcite-button>
            <calcite-button icon-start="basemap">Basemap</calcite-button>
          </div>
        </calcite-panel>
      </calcite-shell>
    </demo-dom-swapper>
    <calcite-dialog
      id="control-panel"
      heading="Controls"
      open
      drag-enabled
      close-disabled
      escape-disabled
      focus-trap-disabled
      placement="bottom-end"
      width="s"
    >
      <div class="control-panel">
        <section class="control-section" aria-labelledby="scale-heading">
          <h2 id="scale-heading" class="control-section-heading">Scale</h2>
          <calcite-segmented-control id="scale-control" label-text="Baseline scale" width="full">
            <calcite-segmented-control-item value="s">S</calcite-segmented-control-item>
            <calcite-segmented-control-item value="m" checked>M</calcite-segmented-control-item>
            <calcite-segmented-control-item value="l">L</calcite-segmented-control-item>
          </calcite-segmented-control>
        </section>
        <section class="control-section" aria-labelledby="density-heading">
          <h2 id="density-heading" class="control-section-heading">Density</h2>
          <calcite-switch id="density-mode-switch" label-text-end="Custom density factor"></calcite-switch>
          <calcite-switch id="density-size-switch" label-text-end="Include size tokens"></calcite-switch>
          <calcite-segmented-control id="density-presets" label-text="Density preset" width="full">
            <calcite-segmented-control-item value="50%">50%</calcite-segmented-control-item>
            <calcite-segmented-control-item value="75%">75%</calcite-segmented-control-item>
            <calcite-segmented-control-item value="100%" checked>100%</calcite-segmented-control-item>
            <calcite-segmented-control-item value="125%">125%</calcite-segmented-control-item>
            <calcite-segmented-control-item value="150%">150%</calcite-segmented-control-item>
            <calcite-segmented-control-item value="175%">175%</calcite-segmented-control-item>
          </calcite-segmented-control>
          <calcite-slider
            id="density-slider"
            label-text="Density factor: 100%"
            min="0"
            max="100"
            step="1"
            value="50"
            hidden
          ></calcite-slider>
        </section>
        <section class="control-section" aria-labelledby="font-scale-heading">
          <h2 id="font-scale-heading" class="control-section-heading">Font scale</h2>
          <calcite-switch id="font-scale-mode-switch" label-text-end="Custom font scale"></calcite-switch>
          <calcite-switch id="font-scale-icons-switch" label-text-end="Scale icons with text"></calcite-switch>
          <calcite-segmented-control id="font-scale-presets" label-text="Font scale preset" width="full">
            <calcite-segmented-control-item value="small">Small</calcite-segmented-control-item>
            <calcite-segmented-control-item value="default" checked>Default</calcite-segmented-control-item>
            <calcite-segmented-control-item value="large">Large</calcite-segmented-control-item>
            <calcite-segmented-control-item value="x-large">X-large</calcite-segmented-control-item>
          </calcite-segmented-control>
          <calcite-slider
            id="font-scale-slider"
            label-text="Font scale: 100%"
            min="0"
            max="100"
            step="1"
            value="50"
            hidden
          ></calcite-slider>
        </section>
        <section class="control-section" aria-labelledby="inspect-heading">
          <h2 id="inspect-heading" class="control-section-heading">Inspect</h2>
          <calcite-switch id="height-overlay-switch" label-text-end="Show heights and text sizes"></calcite-switch>
        </section>
      </div>
    </calcite-dialog>
    <demo-options></demo-options>

    <script type="module">
      const scaleControl = document.getElementById("scale-control");
      const modeSwitch = document.getElementById("density-mode-switch");
      const presetControl = document.getElementById("density-presets");
      const densitySlider = document.getElementById("density-slider");
      const sizeSwitch = document.getElementById("density-size-switch");
      const fontScaleModeSwitch = document.getElementById("font-scale-mode-switch");
      const fontScalePresetControl = document.getElementById("font-scale-presets");
      const fontScaleSlider = document.getElementById("font-scale-slider");
      const fontScaleIconsSwitch = document.getElementById("font-scale-icons-switch");
      const heightOverlaySwitch = document.getElementById("height-overlay-switch");

      // measure the visible control only (e.g. input field without its label, list row without nested items)
      const heightTargets = [
        (root) => root.querySelector('calcite-action[active][text="Layers"]')?.shadowRoot?.querySelector(".button"),
        (root) => root.querySelector("calcite-input")?.shadowRoot?.querySelector(".wrapper"),
        (root) => root.querySelector("calcite-list-item")?.shadowRoot?.querySelector(".row"),
        (root) =>
          root
            .querySelectorAll("calcite-block")[1]
            ?.shadowRoot?.querySelector("calcite-switch")
            ?.shadowRoot?.querySelector(".track"),
        (root) => [...root.querySelectorAll("calcite-chip")].at(-1)?.shadowRoot?.querySelector(".container"),
        (root) => root.querySelector("calcite-radio-button")?.shadowRoot?.querySelector(".radio"),
        (root) => root.querySelectorAll("calcite-checkbox")[1]?.shadowRoot?.querySelector(".toggle"),
        (root) => root.querySelector('calcite-button[icon-start="basemap"]')?.shadowRoot?.querySelector("button"),
      ];

      let heightOverlay;
      let heightOverlayFrame;
      let textInspectorBox;
      let textInspectorLabel;

      function getComposedParent(element) {
        return element.assignedSlot ?? element.parentElement ?? element.getRootNode().host;
      }

      // slotted text renders inside the shadow element that holds the slot, so check assigned nodes too
      function hasOwnText(element) {
        if (element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement) {
          return true;
        }
        return [...element.childNodes].some((node) =>
          (node instanceof HTMLSlotElement ? node.assignedNodes({ flatten: true }) : [node]).some(
            (child) => child.nodeType === Node.TEXT_NODE && child.textContent.trim(),
          ),
        );
      }

      function findTextElement(x, y) {
        const swapper = document.querySelector("demo-dom-swapper");
        let element = document.elementFromPoint(x, y);
        if (!element || (element !== swapper && !swapper.contains(element))) {
          return null;
        }
        while (element.shadowRoot) {
          const inner = element.shadowRoot.elementFromPoint(x, y);
          if (!inner || inner === element) {
            break;
          }
          element = inner;
        }
        for (let depth = 0; element && depth < 4; depth++) {
          if (hasOwnText(element)) {
            return element;
          }
          element = getComposedParent(element);
        }
        return null;
      }

      function formatPx(value) {
        return value.endsWith("px") ? `${Number(parseFloat(value).toFixed(2))}px` : value;
      }

      function inspectText(event) {
        const element = findTextElement(event.clientX, event.clientY);
        textInspectorBox.hidden = textInspectorLabel.hidden = !element;
        if (!element) {
          return;
        }
        const rect = element.getBoundingClientRect();
        const { fontSize, lineHeight } = getComputedStyle(element);
        Object.assign(textInspectorBox.style, {
          top: `${rect.top}px`,
          left: `${rect.left}px`,
          width: `${rect.width}px`,
          height: `${rect.height}px`,
        });
        Object.assign(textInspectorLabel.style, {
          top: `${event.clientY + 16}px`,
          left: `${event.clientX + 12}px`,
        });
        textInspectorLabel.textContent = `${formatPx(fontSize)} / ${formatPx(lineHeight)}`;
      }

      function renderHeightOverlay() {
        const root = getDemoRoot();
        heightTargets.forEach((findTarget, index) => {
          const box = heightOverlay.children[index];
          const target = findTarget(root);
          const rect = target?.getBoundingClientRect();
          box.hidden = !rect || rect.height === 0;
          if (box.hidden) {
            return;
          }
          Object.assign(box.style, {
            top: `${rect.top}px`,
            left: `${rect.left}px`,
            width: `${rect.width}px`,
            height: `${rect.height}px`,
          });
          box.firstChild.textContent = `${Number(rect.height.toFixed(2))}px`;
        });
        heightOverlayFrame = requestAnimationFrame(renderHeightOverlay);
      }

      function toggleHeightOverlay() {
        if (!heightOverlaySwitch.checked) {
          cancelAnimationFrame(heightOverlayFrame);
          document.removeEventListener("pointermove", inspectText);
          heightOverlay?.remove();
          return;
        }
        heightOverlay = document.createElement("div");
        heightOverlay.className = "height-overlay";
        heightTargets.forEach(() => {
          const box = document.createElement("div");
          box.className = "height-overlay-box";
          const label = document.createElement("span");
          label.className = "height-overlay-label";
          box.append(label);
          heightOverlay.append(box);
        });
        textInspectorBox = document.createElement("div");
        textInspectorBox.className = "text-inspector-box";
        textInspectorLabel = document.createElement("span");
        textInspectorLabel.className = "text-inspector-label";
        textInspectorBox.hidden = textInspectorLabel.hidden = true;
        heightOverlay.append(textInspectorBox, textInspectorLabel);
        document.body.append(heightOverlay);
        document.addEventListener("pointermove", inspectText);
        renderHeightOverlay();
      }

      function getDemoRoot() {
        const swapper = document.querySelector("demo-dom-swapper");
        return swapper.context === "shadow" ? swapper.shadowRoot : swapper;
      }

      function getShell() {
        return getDemoRoot().querySelector("calcite-shell");
      }

      // left half maps to 0.5–1, right half to 1–2
      function sliderValueToFactor(value) {
        return value <= 50 ? 0.5 + (value / 50) * 0.5 : 1 + (value - 50) / 50;
      }

      function applyPreset() {
        const shell = getShell();
        shell.style.removeProperty("--calcite-density-factor");
        shell.setAttribute("data-calcite-density", presetControl.value);
      }

      function applySliderFactor() {
        const factor = sliderValueToFactor(densitySlider.value);
        const shell = getShell();
        // attribute must stay so spacing tokens re-resolve; "custom" matches no preset rule
        shell.setAttribute("data-calcite-density", "custom");
        shell.style.setProperty("--calcite-density-factor", String(factor));
        densitySlider.labelText = `Density factor: ${Math.round(factor * 100)}%`;
      }

      function applyFontScalePreset() {
        const shell = getShell();
        shell.style.removeProperty("--calcite-font-scale");
        shell.setAttribute("data-calcite-font-scale", fontScalePresetControl.value);
      }

      function applyFontScaleSlider() {
        const factor = sliderValueToFactor(fontScaleSlider.value);
        const shell = getShell();
        shell.setAttribute("data-calcite-font-scale", "custom");
        shell.style.setProperty("--calcite-font-scale", String(factor));
        fontScaleSlider.labelText = `Font scale: ${Math.round(factor * 100)}%`;
      }

      scaleControl.addEventListener("calciteSegmentedControlChange", () => {
        getDemoRoot()
          .querySelectorAll("*")
          .forEach((element) => {
            if (element.tagName.startsWith("CALCITE-") && "scale" in element) {
              element.scale = scaleControl.value;
            }
          });
      });

      presetControl.addEventListener("calciteSegmentedControlChange", applyPreset);

      densitySlider.addEventListener("calciteSliderInput", applySliderFactor);

      sizeSwitch.addEventListener("calciteSwitchChange", () => {
        getShell().style.setProperty("--calcite-density-include-size", sizeSwitch.checked ? "1" : "0");
      });

      modeSwitch.addEventListener("calciteSwitchChange", () => {
        const useSlider = modeSwitch.checked;
        presetControl.hidden = useSlider;
        densitySlider.hidden = !useSlider;
        if (useSlider) {
          applySliderFactor();
        } else {
          applyPreset();
        }
      });

      fontScalePresetControl.addEventListener("calciteSegmentedControlChange", applyFontScalePreset);

      heightOverlaySwitch.addEventListener("calciteSwitchChange", toggleHeightOverlay);

      fontScaleIconsSwitch.addEventListener("calciteSwitchChange", () => {
        getShell().style.setProperty("--calcite-font-scale-include-icons", fontScaleIconsSwitch.checked ? "1" : "0");
      });

      fontScaleSlider.addEventListener("calciteSliderInput", applyFontScaleSlider);

      fontScaleModeSwitch.addEventListener("calciteSwitchChange", () => {
        const useSlider = fontScaleModeSwitch.checked;
        fontScalePresetControl.hidden = useSlider;
        fontScaleSlider.hidden = !useSlider;
        if (useSlider) {
          applyFontScaleSlider();
        } else {
          applyFontScalePreset();
        }
      });
    </script>
  </body>
</html>
