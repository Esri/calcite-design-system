<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Demos</title>
    <script src="/src/demos/_assets/head.ts"></script>
  </head>

  <body>
    <demo-dom-swapper>
      <calcite-field-group>
        <calcite-field-set legend="Bio">
          <calcite-field-group layout="columns" columns="2">
            <calcite-input name="firstName" label-text="First Name"></calcite-input>
            <calcite-input name="lastName" label-text="Last Name"></calcite-input>
          </calcite-field-group>
          <calcite-input name="email" label-text="Email"></calcite-input>
        </calcite-field-set>
        <calcite-field-set legend="Address">
          <calcite-input name="street" label-text="Street"></calcite-input>
          <calcite-field-group layout="columns" columns="2">
            <calcite-input name="city" label-text="City"></calcite-input>
            <calcite-select name="state" label-text="State"></calcite-select>
          </calcite-field-group>
        </calcite-field-set>
      </calcite-field-group>
    </demo-dom-swapper>
    <demo-options></demo-options>
  </body>
</html>
