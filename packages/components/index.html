      <style>
        calcite-panel {
          /* --calcite-panel-space: 2rem; */

      <calcite-panel heading="Panel">
        <span>Hello! I'm outside the dialog and thus dont get the extra padding</span>
      </calcite-panel>
      <calcite-dialog reference-element="button" open>
        <calcite-panel style="--calcite-color-background: lightblue" heading="Extra padding">
          Hi, I no longer get extra padding inside a dialog
          <calcite-panel style="--calcite-color-background: lightgreen" heading="Nested panel">
